<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA39A"/>
      <stop offset="0.55" stop-color="#16807F"/>
      <stop offset="1" stop-color="#0E5560"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#04262B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <rect x="50" y="38" width="138" height="180" rx="16" fill="#FFFFFF"/>
  </g>
  <!-- filled field 1 -->
  <rect x="68" y="60" width="44" height="8" rx="4" fill="#9CB8BB"/>
  <rect x="68" y="74" width="102" height="20" rx="6" fill="#E6F3F2" stroke="#BFDCDA" stroke-width="2"/>
  <path d="M152 84 l5 5 9-10" stroke="#16807F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- filled field 2 -->
  <rect x="68" y="108" width="56" height="8" rx="4" fill="#9CB8BB"/>
  <rect x="68" y="122" width="102" height="20" rx="6" fill="#E6F3F2" stroke="#BFDCDA" stroke-width="2"/>
  <path d="M152 132 l5 5 9-10" stroke="#16807F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- empty required field -->
  <rect x="68" y="156" width="50" height="8" rx="4" fill="#9CB8BB"/>
  <rect x="68" y="170" width="102" height="20" rx="6" fill="#FFF1EE" stroke="#F0624D" stroke-width="3"/>
  <!-- asterisk badge -->
  <g filter="url(#sh)">
    <circle cx="196" cy="198" r="34" fill="#F0624D"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" transform="translate(196 198)">
    <line x1="0" y1="-16" x2="0" y2="16"/>
    <line x1="-13.9" y1="-8" x2="13.9" y2="8"/>
    <line x1="-13.9" y1="8" x2="13.9" y2="-8"/>
  </g>
