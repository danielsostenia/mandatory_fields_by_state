<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Mandatory Fields by State</title>
  <desc id="desc">Simple 800x400 app icon: rounded card with checklist glyph and module name.</desc>

  <!-- background -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f77ff"/>
      <stop offset="1" stop-color="#33c1ff"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rounded card -->
  <rect x="24" y="20" rx="20" ry="20" width="752" height="360" fill="url(#g)" filter="url(#s)"/>

  <!-- left glyph: checklist -->
  <g transform="translate(120,90)" fill="#fff" opacity="0.95">
    <rect x="0" y="0" width="200" height="200" rx="16" ry="16" fill="rgba(255,255,255,0.06)"/>
    <!-- three lines -->
    <rect x="80" y="28" width="88" height="18" rx="6" ry="6" />
    <rect x="80" y="82" width="88" height="18" rx="6" ry="6" />
    <rect x="80" y="136" width="88" height="18" rx="6" ry="6" />
    <!-- check marks -->
    <path d="M22 44 l22 22 44-44" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M22 98 l22 22 44-44" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M22 152 l22 22 44-44" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- right text -->
  <g transform="translate(360,120)" fill="#ffffff">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="42" font-weight="700">Mandatory Fields</text>
    <text x="0" y="56" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="28" opacity="0.95">by State — lightweight rules</text>
    <text x="0" y="110" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" opacity="0.85">sale.order · purchase.order · account.move</text>
  </g>
</svg>
